# Proxy settings shared by the ISSATKr locations.
# Install as /etc/nginx/snippets/issatkr-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";

# The app compares Origin with Host (CSRF check): keep the public host name
# AND port. $http_host is the Host header as the browser sent it, so it keeps
# a non-standard port (e.g. :4434); $host would drop it and every login/save
# would be refused with 403 "Origine refusée".
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;

# OVERWRITE (do not append) the client address: the app's per-IP login limit
# and the audit log trust the first X-Forwarded-For value.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Imports of large workbooks can take a while.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering on;
