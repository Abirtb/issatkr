# Proxy settings shared by the ISSATKr locations.
# Install as /etc/nginx/snippets/issatkr-proxy.conf.
proxy_http_version 1.1;
proxy_set_header Connection "";

# The app compares Origin with Host (CSRF check): keep the public host name.
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto $scheme;

# OVERWRITE (do not append) the client address: the app's per-IP login limit
# and the audit log trust the first X-Forwarded-For value.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;

# Imports of large workbooks can take a while.
proxy_read_timeout 120s;
proxy_send_timeout 120s;
proxy_buffering on;
