# ISSATKr — Nginx reverse proxy (host). Template: replace YOUR_DOMAIN.
# Install: /etc/nginx/sites-available/issatkr.conf, symlink into sites-enabled,
#          nginx -t && systemctl reload nginx. See DEPLOYMENT.md §7–8.
#
# The application container listens on 127.0.0.1:3000 only (compose.yaml).
# Security headers (CSP, HSTS, X-Frame-Options, …) are set by the application.

# Edge rate limit on the login endpoint (the app also limits per account / IP).
limit_req_zone $binary_remote_addr zone=issatkr_login:10m rate=10r/m;

upstream issatkr_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

# HTTP: only the ACME challenge (certificate issuance/renewal) and a redirect.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" on the listen line works on every Nginx version shipped by current
    # LTS distributions (on >= 1.25.1 you may switch to the "http2 on;" directive).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # TLS certificate — written by certbot (DEPLOYMENT.md §8). Paths must exist
    # before this block is enabled.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:issatkr_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    # Same limit as the application (12 MB request, 5 MB per file).
    client_max_body_size 12m;

    # Machine-to-machine endpoint: called from the server itself on 127.0.0.1,
    # never from the Internet.
    location = /api/cron/notifications {
        return 404;
    }

    location = /api/auth/login {
        limit_req zone=issatkr_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://issatkr_app;
        include /etc/nginx/snippets/issatkr-proxy.conf;
    }

    location / {
        proxy_pass http://issatkr_app;
        include /etc/nginx/snippets/issatkr-proxy.conf;
    }

    access_log /var/log/nginx/issatkr.access.log;
    error_log  /var/log/nginx/issatkr.error.log warn;
}
